<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Welcome, {{ session["username"] }}!</h1>

        <h2>Add Expense</h2>

        <form method="POST" action="/add-expense" class="form-box">

            <label>Amount</label>
            <input type="number"
                   step="0.01"
                   name="amount"
                   required>

            <label>Category</label>
            <input type="text"
                   name="category"
                   placeholder="Food, Travel, Shopping..."
                   required>

            <label>Description</label>
            <input type="text"
                   name="description"
                   placeholder="Enter description">

            <label>Date</label>
            <input type="date"
                   name="date"
                   required>

            <button type="submit" class="btn">
                Add Expense
            </button>

        </form>

        <h2>Your Expenses</h2>

        {% if expenses %}

            <div class="expense-list">

                {% for expense in expenses %}

                    <div class="expense-item">

                        <div>
                            <strong>₹{{ expense["amount"] }}</strong>

                            <span>
                                {{ expense["category"] }}
                            </span>

                            <p>
                                {{ expense["description"] }}
                            </p>

                            <small>
                                {{ expense["date"] }}
                            </small>
                        </div>

                        <form method="POST"
                              action="/delete-expense">

                            <input type="hidden"
                                   name="expense_id"
                                   value="{{ expense['id'] }}">

                            <button type="submit"
                                    class="delete-btn">
                                Delete
                            </button>

                        </form>

                    </div>

                {% endfor %}

            </div>

        {% else %}

            <p>No expenses added yet.</p>

        {% endif %}

        <br>

        <a href="/logout" class="logout-btn">
            Logout
        </a>

    </div>

</body>
</html>
